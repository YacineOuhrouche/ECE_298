# Tiny Tapeout project information
project:
  title:        "8-bit Programmable Timer"
  author:       "Yacine Ouhrouche"
  discord:      "YacineOuhrouche"
  description:  "An 8-bit programmable timer"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_YOUR_GITHUB_USERNAME_programmable_timer"

  # Source files in ./src
  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "DATA_IN_0"
  ui[1]: "DATA_IN_1"
  ui[2]: "DATA_IN_2"
  ui[3]: "DATA_IN_3"
  ui[4]: "DATA_IN_4"
  ui[5]: "DATA_IN_5"
  ui[6]: "DATA_IN_6"
  ui[7]: "DATA_IN_7"

  # Outputs
  uo[0]: "COUNT_0"
  uo[1]: "COUNT_1"
  uo[2]: "COUNT_2"
  uo[3]: "COUNT_3"
  uo[4]: "COUNT_4"
  uo[5]: "COUNT_5"
  uo[6]: "COUNT_6"
  uo[7]: "COUNT_7"

  # Bidirectional pins
  uio[0]: "LOAD"
  uio[1]: "ENABLE"
  uio[2]: "COUNT_DOWN"
  uio[3]: "DONE"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
